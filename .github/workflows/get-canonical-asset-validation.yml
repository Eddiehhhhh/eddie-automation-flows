name: Isolated Get canonical attachment validation
on:
  push:
    branches: [codex/get-canonical-asset-validation]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/engine/get-runtime/scripts
      PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      FULL_PROBE_RESULT: ${{ github.workspace }}/get-full-probe-result.json
      GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
      GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
      GET_PRIVATE_BINDINGS_FILE: ${{ github.workspace }}/private/.sync/get-notion/runtime-bindings-da4c0aa7a5f1276c48bf177cb112c6f163f5d322652b762ae7f7a2ffc5fd7512.json
      GET_ASSET_SAMPLE_FILE: ${{ github.workspace }}/private/Raw/03 Get/01 Notes/Cloud Proof/asset-probe.json
      CANDIDATE_OUTPUT: ${{ github.workspace }}/private/Raw/03 Get/01 Notes/Cloud Proof/Canonical Candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e10e8548fbf0bcaf3ef746e8d0ad875901d4aecb
          path: engine
          persist-credentials: false
          filter: blob:none
          sparse-checkout: get-runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          ref: codex/get-cloud-proof
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: private
          filter: blob:none
          sparse-checkout: |
            Raw/03 Get/01 Notes/Cloud Proof
            .sync/get-notion
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Validate candidate source, assets and atomic baseline transaction
        run: |
          chmod 600 "$GET_PRIVATE_BINDINGS_FILE"
          python -m unittest discover -s engine/get-runtime/tests -p 'test_exact_source_binding.py' -v
          python -m unittest discover -s engine/get-runtime/tests -p 'test_get_canonical_asset*.py' -v
          python -m unittest discover -s engine/get-runtime/tests -p 'test_get_full_entry_publication_fixture.py' -v
          python -m unittest discover -s engine/get-runtime/tests -p 'test_get_canonical_live_asset_probe.py' -v
      - name: Store isolated candidate for remote readback
        run: python scripts/commit_private_vault.py --vault private --ref codex/get-cloud-proof --message 'Verify isolated canonical attachment candidate' --path 'Raw/03 Get/01 Notes/Cloud Proof/Canonical Candidate' --force
      - name: Validate complete original entry and publisher against isolated ref
        run: python scripts/get_canonical_full_runtime_probe.py
