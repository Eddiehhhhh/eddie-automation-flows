name: Hermes Daily Iteration

on:
  schedule:
    # 12:00 Asia/Shanghai. GitHub cron is UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target date in YYYY-MM-DD; defaults to yesterday in Asia/Shanghai"
        required: false
        type: string
        default: ""
      window_days:
        description: "Optional lookback window; defaults to 3"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [iteration-daily]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private vault
        uses: actions/checkout@v4
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify iteration scripts compile
        run: |
          PYTHONPYCACHEPREFIX=/tmp python3 -m py_compile \
            scripts/run_iteration_pipeline.py \
            scripts/iteration_closeout.py \
            scripts/build_observatory_frontend.py \
            scripts/iteration_source_discovery.py \
            scripts/iteration_incremental_audit.py \
            scripts/workspace_intake_report.py

      - name: Run daily iteration pipeline
        env:
          ITERATION_TARGET_DATE: ${{ github.event.client_payload.target_date || github.event.inputs.target_date || '' }}
          ITERATION_WINDOW_DAYS: ${{ github.event.client_payload.window_days || github.event.inputs.window_days || '' }}
        run: |
          set -euo pipefail
          args=(python3 scripts/run_iteration_pipeline.py --mode daily --write-latest --finalize --format json --state-output .github/state/iteration-daily-last-run.json)
          if [ -n "${ITERATION_TARGET_DATE}" ]; then
            args+=(--target-date "${ITERATION_TARGET_DATE}")
          fi
          if [ -n "${ITERATION_WINDOW_DAYS}" ]; then
            args+=(--window-days "${ITERATION_WINDOW_DAYS}")
          fi
          "${args[@]}" > /tmp/iteration-daily-result.json

      - name: Summarize daily iteration run
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/iteration-daily-result.json").read_text(encoding="utf-8"))
          summary_lines = [
              "## daily iteration",
              f"- period: {payload['period']['label']}",
              f"- window: {payload['period']['window_start']} -> {payload['period']['window_end']}",
              f"- total_candidates: {payload['audit']['counts']['total_candidates']}",
              f"- high_priority_candidates: {payload['audit']['counts']['high_priority_candidates']}",
              f"- current_daily_frontend: {payload['frontend']['views'].get('daily')}",
              f"- registered_missing: {len(payload['discovery']['summary'].get('registered_missing', []))}",
              f"- unregistered_existing: {len(payload['discovery']['summary'].get('unregistered_existing', []))}",
          ]
          with Path(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])).open("a", encoding="utf-8") as fh:
              fh.write("\n".join(summary_lines) + "\n")
          PY

      - name: Commit iteration artifacts
        run: |
          git -C vault config user.name "github-actions[bot]"
          git -C vault config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C vault add \
            ".github/state/iteration-daily-last-run.json" \
            "Raw/00 Meta" \
            "Raw/05 Chat" \
            "Wiki/06 Systems/工作区自动收口报告.md" \
            "Wiki/10 观测站/艾迪宇宙观测站/daily" \
            "Wiki/10 观测站/艾迪宇宙观测站/index.html" \
            "Wiki/10 观测站/艾迪宇宙观测站/metrics/observatory-data.json"
          if git -C vault diff --cached --quiet; then
            echo "No daily iteration changes to commit."
          else
            git -C vault commit -m "Run daily iteration pipeline"
            git -C vault pull --rebase origin main
            git -C vault push
          fi
