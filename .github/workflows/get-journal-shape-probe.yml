name: Get private journal-shape push probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: controller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '6214326913f689d242afeb8cfc8e2cfb3d383281'
          persist-credentials: false
          path: runtime
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Materialize verified private binding
        working-directory: runtime/get-runtime
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-journal-shape/runtime-bindings.json
          APPLY: 'false'
        run: python scripts/get_private_runtime_bindings.py --destination "$GET_PRIVATE_BINDINGS_FILE"
      - name: Push synthetic journal shape to isolated branch
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-journal-shape/runtime-bindings.json
          PYTHONPATH: ${{ github.workspace }}/runtime/get-runtime/scripts:${{ github.workspace }}/controller/scripts
        run: python controller/scripts/get_journal_shape_probe.py
