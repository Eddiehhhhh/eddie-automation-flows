# Local deterministic template only. Publish only after final production approval.
name: Canonical Get single writer
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only under the separately approved recurring scope
        type: boolean
        default: false
        required: true
      notion_mode:
        description: Canonical sync or separately registered bounded manual mode
        type: choice
        default: canonical
        required: true
        options:
          - canonical
          - historical-capture
          - historical-apply
          - property-apply
          - private-single-note-proof
      notion_input_sha256:
        description: Registered private input digest; empty for canonical
        type: string
        default: ''
        required: false
      private_proof_key:
        description: Select one reviewed private Get note; contains no note ID
        type: choice
        options:
          - recording-card-20261108
        required: false
      create_test_note:
        description: Create one fixed Get note and sync only that note end to end
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false
jobs:
  canonical-get:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: get-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: '6214326913f689d242afeb8cfc8e2cfb3d383281'
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install verified metadata parser
        run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-notion-properties.txt'
      - name: Verify pinned reviewed runtime
        env:
          RUNTIME_SHA: '6214326913f689d242afeb8cfc8e2cfb3d383281'
        run: test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
      - name: Validate single-note request
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.private_proof_key != '' || inputs.create_test_note) }}
        env:
          PRIVATE_PROOF_KEY: ${{ inputs.private_proof_key }}
          CREATE_TEST_NOTE: ${{ inputs.create_test_note }}
          APPLY: ${{ inputs.apply }}
          NOTION_MODE: ${{ inputs.notion_mode }}
        run: |
          test "$APPLY" = true
          if test -n "$PRIVATE_PROOF_KEY"; then
            test "$NOTION_MODE" = private-single-note-proof
            test "$CREATE_TEST_NOTE" = false
            test "$PRIVATE_PROOF_KEY" = recording-card-20261108
          else
            test "$NOTION_MODE" = canonical
          fi
      - name: Validate bounded Notion route before Get
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notion_mode != 'canonical' }}
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          NOTION_MODE: ${{ inputs.notion_mode || 'canonical' }}
          NOTION_INPUT_SHA256: ${{ inputs.private_proof_key || inputs.notion_input_sha256 }}
        run: python scripts/get_notion_route_selection.py
      - name: Materialize verified private runtime data
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          NOTION_MODE: ${{ inputs.notion_mode || 'canonical' }}
          NOTION_INPUT_SHA256: ${{ inputs.private_proof_key || inputs.notion_input_sha256 }}
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: python scripts/get_private_runtime_bindings.py --destination "$GET_PRIVATE_BINDINGS_FILE"
      - name: Resolve private Get note proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_proof_key != '' }}
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PRIVATE_PROOF_KEY: ${{ inputs.private_proof_key }}
        run: python scripts/get_private_single_note_proof.py --key "$PRIVATE_PROOF_KEY" --github-env "$GITHUB_ENV"
      - name: Validate complete private Notion route before Get
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notion_mode != 'canonical' }}
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          NOTION_MODE: ${{ inputs.notion_mode || 'canonical' }}
          NOTION_INPUT_SHA256: ${{ inputs.private_proof_key || inputs.notion_input_sha256 }}
        run: python scripts/get_notion_controller_route.py --preflight
      - name: Prepare reviewed public policy
        env:
          POLICY_B64: ''
          POLICY_SHA256: 'b68d296aacb0c89d8cb9be572fd27392d5f840d7c81c6324fb4740e17290c2f3'
        run: |
          python - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          value = base64.b64decode(os.environ['POLICY_B64'], validate=True)
          assert hashlib.sha256(value).hexdigest() == os.environ['POLICY_SHA256']
          path = Path(os.environ['RUNNER_TEMP']) / 'get-recurring-public-policy.json'
          with path.open('xb') as stream:
              stream.write(value)
          PY
      # Private proof keys resolve to one note ID inside the hash-bound private runtime bundle.
      # Reuse the fixed test note on later runs instead of creating duplicates.
      - name: Create one real Get sync test note
        id: create_test_note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_test_note }}
        env:
          GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
          GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$GETNOTE_API_KEY"
          test -n "$GETNOTE_CLIENT_ID"
          title='艾迪宇宙云端同步验收（2026-11-05）'
          marker='验收标记：get-cloud-sync-20261105'
          content="用于验证 Get 笔记 → 私有 GitHub → Notion 的云端自动同步。$marker。由验收流程创建，保留为链路记录。"
          umask 077
          TEST_TITLE="$title" TEST_MARKER="$marker" TEST_NOTE_ID_FILE="$RUNNER_TEMP/get-test-note-id" python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import sync_getnote_to_raw as getnote

          try:
              notes = getnote.fetch_note_list(
                  os.environ["GETNOTE_API_KEY"], os.environ["GETNOTE_CLIENT_ID"], max_pages=None
              )
              matches = {
                  getnote.note_id_from(note)
                  for note in notes
                  if note.get("title") == os.environ["TEST_TITLE"]
                  and isinstance(note.get("content"), str)
                  and os.environ["TEST_MARKER"] in note["content"]
              }
              if len(matches) > 1:
                  raise ValueError("duplicate test notes")
              note_id = next(iter(matches), "")
              if note_id and re.fullmatch(r"[0-9]{1,64}", note_id) is None:
                  raise ValueError("invalid test note ID")
              Path(os.environ["TEST_NOTE_ID_FILE"]).write_text(note_id, encoding="ascii")
          except Exception as error:
              raise SystemExit(f"Complete Get note lookup failed ({type(error).__name__})") from None
          print(f"Enumerated {len(notes)} Get notes; exact test-marker matches: {len(matches)}")
          PY
          note_id=$(cat "$RUNNER_TEMP/get-test-note-id")
          note_action=reused
          if test -z "$note_id"; then
            note_action=created
            payload=$(jq -nc --arg title "$title" --arg content "$content" '{title:$title,content:$content,note_type:"plain_text",tags:["云端同步验收"],parent_id:0}')
            http_status=$(curl --silent --show-error --max-time 20 --noproxy '*' \
              --output "$RUNNER_TEMP/get-created-note.json" --write-out '%{http_code}' \
              --request POST 'https://openapi.biji.com/open/api/v1/resource/note/save' \
              --header "Authorization: $GETNOTE_API_KEY" \
              --header "X-Client-ID: $GETNOTE_CLIENT_ID" \
              --header 'Content-Type: application/json' \
              --data "$payload")
            test "$http_status" = 200 || { echo "Get note creation failed (HTTP $http_status)" >&2; exit 1; }
            note_id=$(jq -er 'if .success == true and (.data.note_id | type == "string" and test("^[0-9]{1,64}$")) then .data.note_id else error("unexpected Get response") end' "$RUNNER_TEMP/get-created-note.json")
          fi
          echo "::add-mask::$note_id"
          echo "note_id=$note_id" >> "$GITHUB_OUTPUT"
          echo "Test note $note_action."
      - name: Emit verified canonical publication anchor
        id: get_sync
        if: ${{ github.event_name == 'schedule' || (inputs.notion_mode != 'historical-capture' && inputs.notion_mode != 'historical-apply') }}
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
          GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
          GET_SINGLE_NOTE_ID: ${{ env.GET_SINGLE_NOTE_ID || steps.create_test_note.outputs.note_id || '' }}
          GET_SINGLE_NOTE_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.private_proof_key != '' || inputs.create_test_note) }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          POLICY_SHA256: 'b68d296aacb0c89d8cb9be572fd27392d5f840d7c81c6324fb4740e17290c2f3'
          SCOPE_SHA256: 'eee449b18d5c64f2c134436f6814d282e3b9fa2bf23057d5c545554c93a73830'
        run: |
          args=(--policy "$RUNNER_TEMP/get-recurring-public-policy.json" --approved-policy-sha256 "$POLICY_SHA256")
          if test "$GITHUB_EVENT_NAME" = schedule; then args+=(--trigger schedule); fi
          if test "$APPLY" = true; then
            args+=(--apply --scope-from-policy --approved-scope-sha256 "$SCOPE_SHA256" --checkpoint "$RUNNER_TEMP/get-recurring-attempt.json" --publication-file "$RUNNER_TEMP/get-canonical-publication.txt")
          fi
          python scripts/get_recurring_runtime.py "${args[@]}"
      - name: Sync confirmed Get content to Notion
        id: notion_sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && inputs.notion_mode != 'canonical' && (steps.get_sync.outcome == 'success' || (steps.get_sync.outcome == 'skipped' && (inputs.notion_mode == 'historical-capture' || inputs.notion_mode == 'historical-apply'))) }}
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA256: 'b68d296aacb0c89d8cb9be572fd27392d5f840d7c81c6324fb4740e17290c2f3'
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          NOTION_MODE: ${{ inputs.notion_mode || 'canonical' }}
          NOTION_INPUT_SHA256: ${{ inputs.private_proof_key || inputs.notion_input_sha256 }}
          GET_SINGLE_NOTE_ID: ${{ env.GET_SINGLE_NOTE_ID || steps.create_test_note.outputs.note_id || '' }}
          GET_SINGLE_NOTE_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.private_proof_key != '' || inputs.create_test_note) }}
        run: |
          if test "$NOTION_MODE" = canonical || test "$NOTION_MODE" = private-single-note-proof; then
            python scripts/get_notion_runtime.py \
              --policy "$RUNNER_TEMP/get-recurring-public-policy.json" \
              --approved-policy-sha256 "$POLICY_SHA256" \
              --publication-file "$RUNNER_TEMP/get-canonical-publication.txt" \
              --apply --scope-from-policy
          elif test "$NOTION_MODE" = historical-capture || test "$NOTION_MODE" = historical-apply; then
            python scripts/get_notion_controller_route.py \
              --policy "$RUNNER_TEMP/get-recurring-public-policy.json" \
              --approved-policy-sha256 "$POLICY_SHA256" \
              --fixed-source --apply --scope-from-policy
          else
            python scripts/get_notion_controller_route.py \
              --policy "$RUNNER_TEMP/get-recurring-public-policy.json" \
              --approved-policy-sha256 "$POLICY_SHA256" \
              --publication-file "$RUNNER_TEMP/get-canonical-publication.txt" \
              --apply --scope-from-policy
          fi
# Canonical runs retain independent Get and Notion failure reporting. A Notion
# partial cannot erase a confirmed Get receipt. Fixed archive runs deliberately
# skip Get and emit only their separate source-auth marker, never a Get receipt.

  notion-incremental:
    needs: canonical-get
    if: ${{ needs.canonical-get.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply && inputs.notion_mode == 'canonical' && inputs.private_proof_key == '' && !inputs.create_test_note)) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      CODEX_THREAD_ID: get-notion-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out verified runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: '6214326913f689d242afeb8cfc8e2cfb3d383281'
          path: get-runtime
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install verified metadata parser
        working-directory: get-runtime/get-runtime
        run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-notion-properties.txt'
      - name: Check out private vault without media blobs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Eddiehhhhh/eddie-llm-wiki --jq .private)" = true
          gh auth setup-git --hostname github.com
          git init -q vault
          git -C vault remote add origin https://github.com/Eddiehhhhh/eddie-llm-wiki.git
          git -C vault config core.sparseCheckout true
          cat > vault/.git/info/sparse-checkout <<'SPARSE'
          /AGENTS.md
          /Wiki/
          /Schema/
          /scripts/
          /Scripts/
          /.github/
          /.sync/get-notion/
          /.sync/get-notion-incremental/
          /Raw/03 Get/03 State/
          SPARSE
          git -C vault fetch --filter=blob:none --no-tags origin refs/heads/main
          git -C vault checkout -q -b main FETCH_HEAD
          test "$(git -C vault rev-parse --is-shallow-repository)" = false
          test "$(git -C vault rev-parse origin/main)" = "$(git -C vault rev-parse HEAD)"
          test -z "$(git -C vault status --porcelain --untracked-files=all)"
      - name: Read rules and acquire private write lease
        working-directory: vault
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('AGENTS.md', 'Wiki/索引.md', 'Wiki/06 Systems/01 Routing/规则入口索引.md'):
              assert Path(name).read_text(encoding='utf-8').strip()
          print('Required private-vault rules read.')
          PY
          python3 Scripts/task_preflight.py --integration > "$RUNNER_TEMP/get-notion-preflight.txt"
          grep -q '^INTEGRATION_GUARD_ACTIVE:' "$RUNNER_TEMP/get-notion-preflight.txt"
      - name: Materialize verified private runtime binding
        working-directory: get-runtime/get-runtime
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          APPLY: "true"
        run: python3 scripts/get_private_runtime_bindings.py --destination "$GET_PRIVATE_BINDINGS_FILE"
      - name: Check queued Get notes
        id: notion_queue
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PYTHONPATH: ${{ github.workspace }}/get-runtime/get-runtime/scripts
          APPLY: "true"
        run: |
          set -euo pipefail
          args=(--vault vault)
          if test "$APPLY" = true; then args+=(--apply); fi
          set +e
          python3 - "${args[@]}" <<'PY'
          import get_notion_incremental_controller as controller
          # A note needing content review must not block unrelated verified notes.
          controller.HOLD_CODES = controller.HOLD_CODES | {'content_review_required'}
          controller.main()
          PY
          result=$?
          set -e
          case "$result" in
            0) echo 'state=complete' >> "$GITHUB_OUTPUT" ;;
            2) echo 'state=partial' >> "$GITHUB_OUTPUT" ;;
            *) echo 'state=failed' >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$result"
      - name: Release private write lease
        if: always()
        working-directory: vault
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('Scripts').resolve()))
          from task_guard import guard_directory, release_guard
          from vault_integration_guard import release
          root = Path.cwd()
          release(root)
          release_guard(guard_directory(root))
          PY
      - name: Report independent Notion result
        if: always()
        env:
          RESULT: ${{ job.status }}
          NOTION_STATE: ${{ steps.notion_queue.outputs.state }}
        run: |
          case "$RESULT:$NOTION_STATE" in
            success:complete) message='Get: success; Notion: complete.' ;;
            failure:partial) message='Get: success; Notion: partial, queued notes remain.' ;;
            *) message='Get: success; Notion: failed or incomplete; check this job.' ;;
          esac
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
