name: Get pending read-only probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6a659995b9bcf27c484cb088b535ae3c8cd9878f
          persist-credentials: false
      - name: Materialize verified binding
        working-directory: get-runtime
        env:
          APPLY: "false"
          NOTION_MODE: canonical
          NOTION_INPUT_SHA256: ""
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
        run: python3 scripts/get_private_runtime_bindings.py --destination "$GET_PRIVATE_BINDINGS_FILE"
      - name: Verify pending gate and source receipt
        working-directory: get-runtime
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          POLICY_B64: ''
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, sys, urllib.parse
          sys.path.insert(0, "scripts")
          import get_gitdata_staging as staging
          import get_pending_gate as pending
          import get_private_runtime_bindings as bindings
          import get_publication_provenance as provenance
          import get_recurring_entry as entry
          import get_recurring_policy_recovery as recovery
          try:
              raw = base64.b64decode(os.environ['POLICY_B64'], validate=True)
              policy = provenance.validate_policy(json.loads(raw), hashlib.sha256(raw).hexdigest())
              api = staging.API(os.environ['PRIVATE_VAULT_TOKEN'])
              client = provenance.PublicGithub(os.environ['GITHUB_TOKEN'])
              main = api.call('GET', '/git/ref/heads/main')['object']['sha']
              anchor = pending.check(api, client, policy, main)
              record = bindings.value('get_recurring_policy_recovery', 'SEQ5_BINDING')['record']
              if anchor != record['receipt_commit']:
                  raise ValueError('anchor_mismatch')
              path = urllib.parse.quote(entry.FULL_RECEIPT, safe='/')
              response = api.call('GET', '/contents/' + path + '?ref=' + anchor)
              content = base64.b64decode(response['content'], validate=False)
              digest = hashlib.sha256(content).hexdigest()
              if not recovery.accepts_receipt(anchor, digest, json.loads(content), policy['get_policy_sha256']):
                  raise ValueError('receipt_mismatch')
              print('pending_gate_and_receipt_verified')
          except Exception:
              raise SystemExit('pending_gate_or_receipt_failed') from None
          PYCODE
