name: Cloud read-only acceptance
on:
  push:
    branches: [codex/cloud-readonly-acceptance]
    paths:
      - scripts/cloud_acceptance.py
      - scripts/cloud_private_checkout.py
      - tests/test_cloud_acceptance.py
      - tests/test_cloud_private_checkout.py
      - .github/workflows/cloud-readonly-acceptance.yml
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Observe only the unchanged private binding loader; no migration
        type: boolean
        default: false
      source_diagnostic_only:
        description: Observe only the unchanged source proof; no migration
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloud-readonly-acceptance
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.diagnostic_only != true && inputs.source_diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test acceptance boundaries
        run: python -m unittest discover -s tests -p 'test_cloud*.py' -v
      - name: Check out existing private snapshot
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: python scripts/cloud_private_checkout.py --destination vault
      - name: Run deterministic slices with no writes
        run: python scripts/cloud_acceptance.py --vault vault --output /tmp/cloud-acceptance.json
      - name: Publish only allowlisted status
        run: cat /tmp/cloud-acceptance.json >> "$GITHUB_STEP_SUMMARY"
  bindings-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true && inputs.source_diagnostic_only != true && github.ref == 'refs/heads/fix/get-shadow-diagnostics-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e090c7b768135ecd23dcf85dbcab93883b6c273
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Test read-only diagnostic boundaries without credentials
        run: python -m unittest discover -s tests -p 'test_bindings_readonly_diagnostic.py' -v
      - name: Observe unchanged private binding loader once
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GET_BINDINGS_DIAGNOSTIC_ONLY: 'true'
          APPLY: 'false'
          NOTION_MODE: canonical
          NOTION_INPUT_SHA256: ''
        run: python scripts/get_bindings_readonly_diagnostic.py
  source-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.source_diagnostic_only == true && inputs.diagnostic_only != true && github.ref == 'refs/heads/fix/get-shadow-diagnostics-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 29f0e44a9997c8c7028acf6dba33a3dfcc463f15
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Test source diagnostic boundaries without credentials
        run: python -m unittest discover -s tests -p 'test_source_readonly_diagnostic.py' -v
      - name: Observe original source discovery once
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GET_SOURCE_PROOF_DIAGNOSTIC_ONLY: 'true'
          APPLY: 'false'
          NOTION_MODE: canonical
          NOTION_INPUT_SHA256: ''
        run: python scripts/get_source_readonly_diagnostic.py
