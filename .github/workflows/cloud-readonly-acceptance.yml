name: Cloud read-only acceptance
on:
  push:
    branches: [codex/cloud-readonly-acceptance]
    paths:
      - scripts/cloud_acceptance.py
      - scripts/cloud_private_checkout.py
      - tests/test_cloud_acceptance.py
      - tests/test_cloud_private_checkout.py
      - .github/workflows/cloud-readonly-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-readonly-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test acceptance boundaries
        run: python -m unittest discover -s tests -p 'test_cloud*.py' -v
      - name: Check out existing private snapshot
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: python scripts/cloud_private_checkout.py --destination vault
      - name: Run deterministic slices with no writes
        run: python scripts/cloud_acceptance.py --vault vault --output /tmp/cloud-acceptance.json
      - name: Publish only allowlisted status
        run: cat /tmp/cloud-acceptance.json >> "$GITHUB_STEP_SUMMARY"
