name: Sync Notion flomo notes to Raw

on:
  schedule:
    # 03:20 and 15:20 Asia/Shanghai. GitHub cron is UTC.
    - cron: "20 19 * * *"
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      flomo_max_pages:
        description: Maximum changed Flomo pages to stage; 0 is unlimited
        required: false
        type: string
        default: "50"
  repository_dispatch:
    # Keep the existing event type for callers; every trigger runs the same Flomo-only scope.
    types: [sync-notion-personal-data]

permissions:
  contents: read

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_TOKEN }}
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out automation repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out private vault
        id: private_checkout
        uses: actions/checkout@v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
          sparse-checkout: |
            .github/state
            Raw/01 Flomo
            Raw/02 Notion/01 Databases/碎片中心/flomo-stage

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Require Flomo staging configuration
        id: flomo_config
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ["VAULT_ROOT"]) / ".github/state/notion-flomo-config.json"
          if not path.is_file():
              raise SystemExit("Private Flomo configuration is missing.")
          value = json.loads(path.read_bytes())
          if value.get("version") != 1 or value.get("stage_enabled") is not True:
              raise SystemExit("Private Notion Flomo staging is not enabled.")
          if value.get("database_id") != "11233b33-7f23-8024-9555-cb8de8c58e02":
              raise SystemExit("Private Notion Flomo staging must target the approved Fragments Center database.")
          if any(type(value.get(key, False)) is not bool for key in (
              "original_source_enabled", "current_export_enabled", "property_proof_enabled"
          )):
              raise SystemExit("Private Flomo configuration is invalid.")
          if value.get("original_source_enabled") is not False:
              raise SystemExit("Direct Flomo API capture must stay disabled; this workflow reads Notion only.")
          PYTHON

      - name: Stage Flomo-ID notes from Notion only
        id: flomo_sync
        continue-on-error: true
        if: ${{ !cancelled() && steps.flomo_config.outcome == 'success' }}
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          FLOMO_MAX_PAGES: ${{ inputs.flomo_max_pages || '50' }}
        run: |
          python scripts/run_private_command.py --label "Notion Flomo staging" -- \
            python scripts/sync_notion_flomo_to_raw.py --apply \
            --config "$VAULT_ROOT/.github/state/notion-flomo-config.json" \
            --max-pages "$FLOMO_MAX_PAGES"

      - name: Persist Flomo staging and progress
        id: flomo_commit
        if: ${{ !cancelled() && (steps.flomo_sync.outcome == 'success' || steps.flomo_sync.outcome == 'failure') }}
        run: |
          paths=()
          for item in "Raw/02 Notion/01 Databases/碎片中心/flomo-stage" ".github/state/notion-flomo-sync-state.json" "Raw/01 Flomo/云端" ".github/state/flomo-cloud-current-state.json"; do
            if test -e "$VAULT_ROOT/$item"; then paths+=(--path "$item"); fi
          done
          if test "${#paths[@]}" -gt 0; then
            python scripts/commit_private_vault.py --all --ref main \
              --message "Persist private Notion Flomo staging" "${paths[@]}"
          fi

      - name: Verify private Flomo state
        id: flomo_readback
        if: ${{ !cancelled() && steps.flomo_commit.outcome == 'success' }}
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python scripts/run_private_command.py --label "Private Flomo state readback" -- \
            python scripts/sync_notion_flomo_to_raw.py --verify-remote-state

      - name: Report incomplete Flomo sync
        if: ${{ always() && !cancelled() && (steps.flomo_config.outcome == 'failure' || steps.flomo_sync.outcome == 'failure' || steps.flomo_commit.outcome == 'failure' || steps.flomo_readback.outcome == 'failure') }}
        run: |
          echo "Flomo sync is incomplete; inspect private coverage and persistence/readback steps."
          exit 2
