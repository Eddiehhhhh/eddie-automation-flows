name: Sync Notion flomo notes to Raw

on:
  schedule:
    # 03:20 and 15:20 Asia/Shanghai. GitHub cron is UTC.
    - cron: "20 19 * * *"
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      flomo_max_pages:
        description: Maximum changed Flomo pages to stage; 0 is unlimited
        required: false
        type: string
        default: "50"
  repository_dispatch:
    # Keep the existing event type for callers; every trigger runs the same Flomo-only scope.
    types: [sync-notion-personal-data]

permissions:
  contents: read

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_TOKEN }}
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out automation repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out private vault
        id: private_checkout
        uses: actions/checkout@v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
          sparse-checkout: |
            .github/state
            Raw/01 Flomo
            Raw/02 Notion/01 Databases/碎片中心/flomo-stage

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Require Flomo staging configuration
        id: flomo_config
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ["VAULT_ROOT"]) / ".github/state/notion-flomo-config.json"
          if not path.is_file():
              raise SystemExit("Private Flomo configuration is missing.")
          value = json.loads(path.read_bytes())
          if value.get("version") != 1 or value.get("stage_enabled") is not True:
              raise SystemExit("Private Notion Flomo staging is not enabled.")
          if value.get("database_id") != "11233b33-7f23-8024-9555-cb8de8c58e02":
              raise SystemExit("Private Notion Flomo staging must target the approved Fragments Center database.")
          if any(type(value.get(key, False)) is not bool for key in (
              "original_source_enabled", "current_export_enabled", "property_proof_enabled"
          )):
              raise SystemExit("Private Flomo configuration is invalid.")
          if value.get("original_source_enabled") is not False:
              raise SystemExit("Direct Flomo API capture must stay disabled; this workflow reads Notion only.")
          PYTHON

      - name: Stage Flomo-ID notes from Notion only
        id: flomo_sync
        continue-on-error: true
        if: ${{ !cancelled() && steps.flomo_config.outcome == 'success' }}
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          FLOMO_MAX_PAGES: ${{ inputs.flomo_max_pages || '50' }}
        run: |
          python scripts/run_private_command.py --label "Notion Flomo staging" --stdout-file "$RUNNER_TEMP/flomo-sync-result.json" -- \
            python scripts/sync_notion_flomo_to_raw.py --apply \
            --config "$VAULT_ROOT/.github/state/notion-flomo-config.json" \
            --max-pages "$FLOMO_MAX_PAGES"

      - name: Persist Flomo staging and progress
        id: flomo_commit
        if: ${{ !cancelled() && (steps.flomo_sync.outcome == 'success' || steps.flomo_sync.outcome == 'failure') }}
        run: |
          paths=()
          for item in "Raw/02 Notion/01 Databases/碎片中心/flomo-stage" ".github/state/notion-flomo-sync-state.json" "Raw/01 Flomo/云端" ".github/state/flomo-cloud-current-state.json"; do
            if test -e "$VAULT_ROOT/$item"; then paths+=(--path "$item"); fi
          done
          if test "${#paths[@]}" -gt 0; then
            python scripts/commit_private_vault.py --all --ref main \
              --message "Persist private Notion Flomo staging" "${paths[@]}"
          fi

      - name: Verify private Flomo state
        id: flomo_readback
        if: ${{ !cancelled() && steps.flomo_commit.outcome == 'success' }}
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python scripts/run_private_command.py --label "Private Flomo state readback" -- \
            python scripts/sync_notion_flomo_to_raw.py --verify-remote-state

      - name: Report incomplete Flomo sync
        if: ${{ always() && !cancelled() && (steps.flomo_config.outcome == 'failure' || steps.flomo_sync.outcome == 'failure' || steps.flomo_commit.outcome == 'failure' || steps.flomo_readback.outcome == 'failure') }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'flomo-sync-result.json'
          try:
              records = [json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              diagnostic = next((row['diagnostic'] for row in reversed(records) if isinstance(row, dict) and isinstance(row.get('diagnostic'), dict)), {})
          except (OSError, ValueError):
              diagnostic = {}
          categories = {'notion_http_error', 'network_error', 'staging_error', 'partial_capture'}
          lines = ['### Flomo sync diagnostic']
          category = diagnostic.get('category')
          lines.append('- Category: ' + (category if isinstance(category, str) and category in categories else 'details_unavailable'))
          if type(diagnostic.get('http_status')) is int and 100 <= diagnostic['http_status'] <= 599:
              lines.append('- HTTP status: ' + str(diagnostic['http_status']))
          operations = {'database_query', 'page_properties', 'page', 'block_children', 'block', 'other'}
          if isinstance(diagnostic.get('operation'), str) and diagnostic['operation'] in operations:
              lines.append('- Notion operation: ' + diagnostic['operation'])
          errors = {'unauthorized', 'restricted_resource', 'object_not_found', 'rate_limited', 'invalid_json', 'invalid_request_url', 'invalid_request', 'validation_error', 'conflict_error', 'internal_server_error', 'service_unavailable', 'request_timeout'}
          if isinstance(diagnostic.get('notion_error_code'), str) and diagnostic['notion_error_code'] in errors:
              lines.append('- Notion error: ' + diagnostic['notion_error_code'])
          for key in ('notion_pages', 'flomo_ids', 'written', 'pending'):
              value = diagnostic.get(key)
              if type(value) is int and 0 <= value <= 1000000:
                  lines.append('- ' + key.replace('_', ' ') + ': ' + str(value))
          held = diagnostic.get('held')
          if isinstance(held, dict):
              safe = []
              for key, value in held.items():
                  code = key if key in {'source_identity_not_observed', 'stage_edited', 'source_identity_changed', 'incomplete_asset', 'incomplete_relation', 'unsupported_block', 'block_cycle', 'asset_file_budget', 'asset_batch_bound', 'potential_credential_in_source', 'incomplete_property_proof', 'unsupported_property_renderer_revision', 'state_changed', 'source_changed_during_read', 'source_or_stage_failed', 'other'} else 'other'
                  if type(value) is int and 0 <= value <= 1000000:
                      safe.append(code + '=' + str(value))
              if safe:
                  lines.append('- Held reasons: ' + ', '.join(sorted(safe)))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          exit 2
