name: Get Notion migration safety tests
on:
  pull_request:
    paths:
      - 'scripts/get_notion*.py'
      - 'scripts/get_private*.py'
      - 'scripts/get_public_release_guard.py'
      - 'tests/test_private*.py'
      - 'tests/test_public_release_guard.py'
      - 'scripts/get_legacy_adapter.py'
      - 'scripts/get_canonical_writer.py'
      - 'scripts/get_canonical_manual.py'
      - 'tests/test_canonical_read_efficiency.py'
      - 'tests/test_notion*.py'
      - 'tests/test_executor_live_adapter.py'
      - 'requirements-notion-properties.txt'
      - '.github/workflows/get-notion-properties-offline.yml'
      - '.github/workflow-templates/get-canonical-controller.yml.disabled'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install verified metadata parser
        run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-notion-properties.txt'
      # Full real-history transaction replay is retained privately and required
      # separately before release. Never inject private capsules into public CI.
      - name: Test synthetic privacy and loading boundary without credentials
        env:
          PYTHONPATH: scripts:tests
        run: python -m unittest test_private_runtime_bindings test_private_binding_materialization test_notion_route_selection test_private_proof test_private_runtime_report test_public_release_guard -v
