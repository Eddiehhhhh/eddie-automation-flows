name: Sync GetNote to Raw

on:
  schedule:
    # 03:20, 09:20, 15:20, 21:20 Asia/Shanghai. GitHub cron is UTC.
    - cron: "20 19 * * *"
    - cron: "20 1 * * *"
    - cron: "20 7 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-getnote]

permissions:
  contents: write

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
      GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
      GETNOTE_SYNC_HOURS: "8"
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out private vault
        uses: actions/checkout@v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync GetNote notes
        run: python scripts/run_private_command.py --label "GetNote sync" -- python scripts/sync_getnote_to_raw.py

      - name: Validate filename compliance
        if: ${{ success() }}
        run: |
          python scripts/run_private_command.py --label "GetNote filename audit" -- python scripts/audit_raw_filenames.py --source get --json

      - name: Commit Raw updates
        if: ${{ success() }}
        run: |
          python scripts/commit_private_vault.py --message "Sync GetNote notes to Raw" --path "Raw/03 Get"
