name: Probe one Get image into an isolated private ref

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: getnote-private-asset-probe-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out private vault main as a read-only base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          ref: main
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
          sparse-checkout: |
            /.sync/get-notion-incremental/queue.json
            /.sync/get-notion-asset-probes/**
            /Raw/03 Get/01 Notes/**
            /Raw/03 Get/_assets/images/**
            /Raw/03 Get/03 State/attachments/**
            /Raw/03 Get/03 State/canonical-registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Capture and verify one Get image on a run-scoped branch
        id: capture
        env:
          GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
          GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: python scripts/run_private_command.py --timeout 720 --label 'Get private image probe' --stdout-file "$RUNNER_TEMP/getnote-private-asset-probe.json" -- python scripts/stage_getnote_asset_probe.py --vault "$VAULT_ROOT"

      - name: Publish safe failure stage
        if: failure()
        env:
          FAILURE_STAGE: ${{ steps.capture.outputs.failure_stage }}
          FAILURE_CATEGORY: ${{ steps.capture.outputs.failure_category }}
          CANDIDATE_STATS: ${{ steps.capture.outputs.candidate_stats }}
        run: |
          case "$FAILURE_STAGE" in
            verify_private_repo|load_credentials|prepare_private_ref|select_candidate|fetch_get_detail|validate_detail_identity|match_image_source|download_bind_attachment|publish_private_ref|verify_stage_paths|git_stage_files|commit_stage_files|push_private_ref|readback_private_ref|readback_private_files|readback_private_proof|unknown) ;;
            *) FAILURE_STAGE=unknown ;;
          esac
          case "$FAILURE_CATEGORY" in
            validation|auth_denied|not_found|rate_limited|server_error|http_error|api_rejected|transport_error|redirect_blocked|detail_error|detail_identity_mismatch|invalid_attachment_schema|no_image_descriptors|url_unbound|private_write_failed) ;;
            *) FAILURE_CATEGORY=validation ;;
          esac
          echo "Get image probe stopped at stage=$FAILURE_STAGE category=$FAILURE_CATEGORY; private output suppressed."
          echo "Get image probe stopped at stage=$FAILURE_STAGE category=$FAILURE_CATEGORY; private output suppressed." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CANDIDATE_STATS" =~ ^[0-9]+(,[0-9]+){15}$ ]]; then
            IFS=, read -r checked detail_ok detail_error attachments_field images_field files_field resources_field image_descriptors descriptor_urls no_image_descriptors url_unbound source_url_matches source_url_mismatches content_embed_urls content_embed_matches content_embed_rejects <<< "$CANDIDATE_STATS"
            safe_counts="checked=$checked,detail_ok=$detail_ok,detail_error=$detail_error,attachments_field=$attachments_field,images_field=$images_field,files_field=$files_field,resources_field=$resources_field,image_descriptors=$image_descriptors,descriptor_urls=$descriptor_urls,no_image_descriptors=$no_image_descriptors,url_unbound=$url_unbound,source_url_matches=$source_url_matches,source_url_mismatches=$source_url_mismatches,content_embed_urls=$content_embed_urls,content_embed_matches=$content_embed_matches,content_embed_rejects=$content_embed_rejects"
            echo "Safe candidate counts: $safe_counts"
            echo "Safe candidate counts: $safe_counts" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish counts only
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'getnote-private-asset-probe.json').read_text())
          allowed = ('status', 'notes', 'image_assets', 'source_field', 'private_files_readback', 'private_ref', 'commit', 'main_targeted')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(json.dumps({key: result[key] for key in allowed}, indent=2))
          PY
