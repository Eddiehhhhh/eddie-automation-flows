name: Get notes from private GitHub to Notion

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Write verified pending Get notes to Notion
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      CODEX_THREAD_ID: get-notion-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out verified runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: 3e43821928057157528493c5b4921e0b41db8638
          path: get-runtime
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install verified metadata parser
        working-directory: get-runtime/get-runtime
        run: 'python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-notion-properties.txt'
      - name: Check out private vault without media blobs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Eddiehhhhh/eddie-llm-wiki --jq .private)" = true
          gh auth setup-git --hostname github.com
          git init -q vault
          git -C vault remote add origin https://github.com/Eddiehhhhh/eddie-llm-wiki.git
          git -C vault config core.sparseCheckout true
          cat > vault/.git/info/sparse-checkout <<'SPARSE'
          /AGENTS.md
          /Wiki/
          /Schema/
          /scripts/
          /Scripts/
          /.github/
          /.sync/get-notion/
          /.sync/get-notion-incremental/
          /Raw/03 Get/03 State/
          SPARSE
          git -C vault fetch --filter=blob:none --no-tags origin refs/heads/main
          git -C vault checkout -q -b main FETCH_HEAD
          test "$(git -C vault rev-parse --is-shallow-repository)" = false
          test "$(git -C vault rev-parse origin/main)" = "$(git -C vault rev-parse HEAD)"
          test -z "$(git -C vault status --porcelain --untracked-files=all)"
      - name: Read rules and acquire private write lease
        working-directory: vault
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('AGENTS.md', 'Wiki/索引.md', 'Wiki/06 Systems/01 Routing/规则入口索引.md'):
              assert Path(name).read_text(encoding='utf-8').strip()
          print('Required private-vault rules read.')
          PY
          python3 Scripts/task_preflight.py --integration > "$RUNNER_TEMP/get-notion-preflight.txt"
          grep -q '^INTEGRATION_GUARD_ACTIVE:' "$RUNNER_TEMP/get-notion-preflight.txt"
      - name: Materialize verified private runtime binding
        working-directory: get-runtime/get-runtime
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: python3 scripts/get_private_runtime_bindings.py --destination "$GET_PRIVATE_BINDINGS_FILE"
      - name: Check queued Get notes
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PYTHONPATH: ${{ github.workspace }}/get-runtime/get-runtime/scripts
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          args=(--vault vault)
          if test "$APPLY" = true; then args+=(--apply); fi
          if test "$APPLY" = true; then
            python3 get-runtime/get-runtime/scripts/get_notion_incremental_controller.py "${args[@]}"
          else
            python3 - "${args[@]}" <<'PY'
          import json
          import subprocess
          import sys
          import get_notion_incremental_controller as controller

          def diagnose(phase, function):
              def wrapped(*args, **kwargs):
                  try:
                      return function(*args, **kwargs)
                  except Exception as error:
                      if isinstance(error, ValueError) and str(error) in controller.HOLD_CODES:
                          raise
                      kinds = {ValueError: 'value', TypeError: 'type', KeyError: 'key',
                               subprocess.CalledProcessError: 'git', OSError: 'os'}
                      codes = {'duplicate_id', 'incomplete_source', 'incomplete_target_read',
                               'id_not_string', 'unmapped_id', 'recording_schema_changed', 'source_timestamps_missing',
                               'source_title_invalid', 'target_schema_changed', 'property_budget',
                               'property_date_projection_invalid', 'property_manual_edit',
                               'property_parser_unavailable', 'property_schema_changed',
                               'property_source_empty', 'property_source_invalid', 'property_source_missing',
                               'property_timestamp_mismatch', 'property_timezone_required', 'property_unowned_value',
                               'identity_query_invalid', 'incomplete_pagination', 'invalid_blocks',
                               'invalid_children', 'invalid_cohort', 'invalid_route', 'invalid_table',
                               'malformed_payload', 'missing_credentials', 'pagination_budget',
                               'read_transport_failed', 'unread_target', 'unsupported_code_color',
                               'unsupported_prepend', 'unsupported_source_format', 'wrong_database',
                               'wrong_note_identity', 'wrong_parent', 'wrong_schema'}
                      result = {'phase': phase, 'category': kinds.get(type(error), 'other')}
                      if type(error) is ValueError and str(error) in codes:
                          result['reason'] = str(error)
                      print(json.dumps(result), file=sys.stderr)
                      raise
              return wrapped

          controller.admission = diagnose('admission', controller.admission)
          controller.worker.run = diagnose('worker', controller.worker.run)
          controller.main()
          PY
          fi
      - name: Release private write lease
        if: always()
        working-directory: vault
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('Scripts').resolve()))
          from task_guard import guard_directory, release_guard
          from vault_integration_guard import release
          root = Path.cwd()
          release(root)
          release_guard(guard_directory(root))
          PY
