name: Verify one canonical Get image in an isolated private ref

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: get-image-canonical-stage-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: get-runtime
    steps:
      - name: Check out the isolated candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out private rules for the write preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          ref: main
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: private-vault-preflight
          persist-credentials: false
          sparse-checkout: |
            scripts
            Scripts
            .github/workflows
            Wiki
            Schema
            Raw/00 Meta/Cloud Inbox
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify private repo and run the original write preflight
        id: private_preflight
        working-directory: ${{ github.workspace }}/private-vault-preflight
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          CODEX_THREAD_ID: get-image-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          root = Path.cwd()
          stage = 'private_repo'
          try:
              stage = 'sparse_checkout'
              must_exist = [
                  'AGENTS.md', 'scripts/task_preflight.py', 'scripts/task_guard.py',
                  'scripts/task_context.py', 'scripts/vault_git_guard.py',
                  'scripts/vault_integration_guard.py', 'Wiki/索引.md',
                  'Wiki/01 Self/工作方式与价值观.md',
                  'Wiki/06 Systems/01 Routing/规则入口索引.md',
                  'Schema/偏好学习与应用协议.md',
              ]
              if any(not (root / relative).is_file() for relative in must_exist):
                  raise ValueError()

              stage = 'private_repo'
              request = urllib.request.Request(
                  'https://api.github.com/repos/Eddiehhhhh/eddie-llm-wiki',
                  headers={'Authorization': 'Bearer ' + os.environ['PRIVATE_VAULT_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  repo = json.loads(response.read(1024 * 1024))
              if repo.get('private') is not True or repo.get('default_branch') != 'main':
                  raise ValueError()

              stage = 'routing_rules'
              extra = [
                  'Wiki/06 Systems/01 Routing/GitHub AI 接入入口.md',
                  'Wiki/06 Systems/02 Operations/GitHub 自动化与发布经验.md',
                  'Raw/00 Meta/Cloud Inbox/README.md',
              ]
              for relative in extra:
                  content = (root / relative).read_text(encoding='utf-8')
                  if not content.strip():
                      raise ValueError()
              route = (root / 'Wiki/06 Systems/01 Routing/规则入口索引.md').read_text(encoding='utf-8')
              if 'GitHub / Actions / PR / push / secret / deploy' not in route:
                  raise ValueError()

              stage = 'task_preflight'
              result = subprocess.run(
                  [sys.executable, 'scripts/task_preflight.py',
                   '--query', 'Get private image isolated staging'],
                  cwd=root, capture_output=True, text=True, check=False)
              if result.returncode:
                  raise ValueError()
              lines = result.stdout.splitlines()
              lease_active = any(line.startswith('SYNC_GUARD_ACTIVE: ') for line in lines)
              if lease_active:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('lease_active=true\n')
              required = {
                  'AGENTS.md', 'Wiki/索引.md',
                  'Wiki/06 Systems/01 Routing/规则入口索引.md'}
              reported = {line.removeprefix('READ_REQUIRED: ')
                          for line in lines if line.startswith('READ_REQUIRED: ')}
              manifest_line = next(line for line in lines if line.startswith('CONTEXT_MANIFEST: '))
              manifest = json.loads(manifest_line.removeprefix('CONTEXT_MANIFEST: '))
              if (not required <= reported or manifest.get('status') != 'ok'
                      or manifest.get('missing') or any(row.get('truncated') for row in manifest.get('sources', []))
                      or not lease_active):
                  raise ValueError()
              stage = 'source_snapshot'
              source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
                  raise ValueError()
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('source_sha=' + source_sha + '\n')
              print('private_preflight=passed')
          except Exception:
              raise SystemExit('private_preflight_failed stage=' + stage) from None
          PY
      - name: Materialize the verified private runtime binding
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          APPLY: 'false'
        run: python scripts/get_private_runtime_bindings.py --destination "$GET_PRIVATE_BINDINGS_FILE"
      - name: Build, stage and read back one canonical image candidate
        env:
          GET_PRIVATE_BINDINGS_FILE: ${{ runner.temp }}/get-private-bindings/runtime-bindings.json
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
          GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GET_PREFLIGHT_SOURCE_SHA: ${{ steps.private_preflight.outputs.source_sha }}
        run: >-
          python scripts/probe_get_image_canonical_stage.py
          --proof-ref codex/get-asset-proof-42297879789-1
      - name: Release this run's private preflight lease
        if: ${{ always() && steps.private_preflight.outputs.lease_active == 'true' }}
        working-directory: ${{ github.workspace }}/private-vault-preflight
        env:
          CODEX_THREAD_ID: get-image-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str((Path.cwd() / 'scripts').resolve()))
          from task_guard import guard_directory, release_guard
          root = Path.cwd()
          lease = release_guard(guard_directory(root))
          if lease.exists():
              raise SystemExit('private_preflight_lease_release_failed')
          print('private_preflight_lease=released')
          PY
