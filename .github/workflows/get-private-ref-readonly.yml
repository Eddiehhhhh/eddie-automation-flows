name: Verify private vault main ref (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-main-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out the reviewed Get runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: 30358ef04b5592065ad4a79321728937657d0b91
          path: runtime
          persist-credentials: false
      - name: Read the private main ref with the existing vault token
        id: private_ref
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get('PRIVATE_VAULT_TOKEN')
          if not token:
              print('private_main_ref=unavailable reason=credential_missing')
              raise SystemExit(1)

          request = urllib.request.Request(
              'https://api.github.com/repos/Eddiehhhhh/eddie-llm-wiki/git/ref/heads/main',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              with opener.open(request, timeout=20) as response:
                  status = response.status
                  value = json.load(response)
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
              print(f'private_main_ref=unavailable http_status={status}')
              raise SystemExit(1)
          except Exception:
              print('private_main_ref=unavailable reason=transport_or_response')
              raise SystemExit(1)
          obj = value.get('object', {})
          if (status != 200 or value.get('ref') != 'refs/heads/main'
                  or obj.get('type') != 'commit'
                  or not isinstance(obj.get('sha'), str)
                  or re.fullmatch(r'[0-9a-f]{40}', obj['sha']) is None):
              print(f'private_main_ref=invalid http_status={status}')
              raise SystemExit(1)
          print(f'private_main_ref=readable http_status={status} sha_length=40')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + obj['sha'] + '\n')
          PY
      - name: Reproduce the exact private history proof without source or destination writes
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          EXPECTED_MAIN_SHA: ${{ steps.private_ref.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path('runtime/get-runtime/scripts').resolve()))
          import get_exact_source_proof as exact_proof
          import get_private_preview_retention as retention
          import get_private_runtime_bindings as bindings
          import get_publication_registered_predecessor as registered

          token = os.environ.get('PRIVATE_VAULT_TOKEN')
          try:
              remote = retention.GitHubRemote(None, token)
              binding_path = Path(os.environ['RUNNER_TEMP']) / 'private-proof' / 'runtime-bindings.json'
              bindings.bootstrap(remote, str(binding_path))
              os.environ[bindings.ENV_FILE] = str(binding_path)
              rows = [row for row in registered.registry()
                      if row['run_binding'].get('id') == exact_proof.ORIGINAL_RUN_ID
                      and row['run_binding'].get('run_attempt') == 1]
              if len(rows) != 1:
                  print('private_git_history_proof=registered_record_unavailable')
                  raise SystemExit(1)
              record = rows[0]['get_record']
              with tempfile.TemporaryDirectory(prefix='private-git-proof-') as directory:
                  exact_proof._chain(Path(directory), remote, os.environ['EXPECTED_MAIN_SHA'],
                                     record['observed_main_commit'], record['receipt_commit'])
              print('private_git_history_proof=success')
          except subprocess.TimeoutExpired:
              print('private_git_history_proof=timeout')
              raise SystemExit(1)
          except ValueError as error:
              allowed = {'exact_proof_git', 'exact_proof_timeout', 'exact_proof_output',
                         'exact_proof_head', 'exact_proof_ancestry', 'exact_proof_commit'}
              code = str(error)
              print('private_git_history_proof=' + (code if code in allowed else 'unverified'))
              raise SystemExit(1)
          except Exception as error:
              print('private_git_history_proof=setup_error class=' + type(error).__name__)
              raise SystemExit(1)
          PY
