name: Verify private vault main ref (read only)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-main-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out the reviewed Get runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: 75655ba42d918f066db4904b236c0bfcbce5f922
          path: runtime
          persist-credentials: false
      - name: Check out the current Get controller policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Read the private main ref with the existing vault token
        id: private_ref
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get('PRIVATE_VAULT_TOKEN')
          if not token:
              print('private_main_ref=unavailable reason=credential_missing')
              raise SystemExit(1)

          request = urllib.request.Request(
              'https://api.github.com/repos/Eddiehhhhh/eddie-llm-wiki/git/ref/heads/main',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              with opener.open(request, timeout=20) as response:
                  status = response.status
                  value = json.load(response)
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
              print(f'private_main_ref=unavailable http_status={status}')
              raise SystemExit(1)
          except Exception:
              print('private_main_ref=unavailable reason=transport_or_response')
              raise SystemExit(1)
          obj = value.get('object', {})
          if (status != 200 or value.get('ref') != 'refs/heads/main'
                  or obj.get('type') != 'commit'
                  or not isinstance(obj.get('sha'), str)
                  or re.fullmatch(r'[0-9a-f]{40}', obj['sha']) is None):
              print(f'private_main_ref=invalid http_status={status}')
              raise SystemExit(1)
          print(f'private_main_ref=readable http_status={status} sha_length=40')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + obj['sha'] + '\n')
          PY
      - name: Reproduce the failed publication-slot check (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import tempfile
          from pathlib import Path

          runtime_scripts = Path('runtime/get-runtime/scripts').resolve()
          sys.path.insert(0, str(runtime_scripts))
          import get_private_preview_retention as retention
          import get_private_runtime_bindings as bindings

          workflow = Path('automation/.github/workflows/get-canonical.yml').read_text(encoding='utf-8')
          policy_b64 = re.search(r"POLICY_B64: '([^']+)'", workflow).group(1)
          policy = json.loads(base64.b64decode(policy_b64, validate=True))
          policy_sha = re.search(r"POLICY_SHA256: '([0-9a-f]{64})'", workflow).group(1)
          private_token = os.environ.get('PRIVATE_VAULT_TOKEN')
          github_token = os.environ.get('GITHUB_TOKEN')

          try:
              with tempfile.TemporaryDirectory(prefix='registered-proof-') as directory:
                  binding_path = Path(directory) / 'bindings' / 'runtime-bindings.json'
                  remote = retention.GitHubRemote(None, private_token)
                  bindings.bootstrap(remote, str(binding_path))
                  os.environ[bindings.ENV_FILE] = str(binding_path)
                  import get_private_proof as proof
                  import get_publication_provenance as provenance

                  policy = provenance.validate_policy(policy, policy_sha)
                  client = provenance.PublicGithub(github_token)
                  resolver = proof.PrivateRecords(remote)
                  resolver.expected_head = remote.ref('refs/heads/main')
                  client.private_proof_source = resolver
                  original_fail = provenance.fail
                  def traced_fail(code):
                      if code == 'provenance_run_changed':
                          frame = sys._getframe(1)
                          print('run_change_check=' + frame.f_code.co_name + ':' + str(frame.f_lineno), flush=True)
                      original_fail(code)
                  provenance.fail = traced_fail
                  result = provenance.discover(
                      client, policy, exclude_run_id=41937842038,
                      exclude_run_attempt=1, reserve_next_run=True)
                  print('publication_slot_check=' + str(result.get('status', 'verified')))
          except SystemExit:
              raise
          except Exception as error:
              code = str(error)
              allowed = {'provenance_run_changed', 'provenance_run', 'provenance_job',
                         'provenance_no_verified_publication', 'private_proof_unverified',
                         'provenance_transport', 'provenance_timestamp'}
              print('publication_slot_check=' + (code if code in allowed else 'failed'))
              raise SystemExit(1)
          PY
