name: Verify private vault main ref (read only)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-main-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out the reviewed Get runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: 2c549d7e816563cf858102f88dbe48a28146346d
          path: runtime
          persist-credentials: false
      - name: Check out the current Get controller policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Eddiehhhhh/eddie-automation-flows
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Read the private main ref with the existing vault token
        id: private_ref
        env:
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          token = os.environ.get('PRIVATE_VAULT_TOKEN')
          if not token:
              print('private_main_ref=unavailable reason=credential_missing')
              raise SystemExit(1)

          request = urllib.request.Request(
              'https://api.github.com/repos/Eddiehhhhh/eddie-llm-wiki/git/ref/heads/main',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              with opener.open(request, timeout=20) as response:
                  status = response.status
                  value = json.load(response)
          except urllib.error.HTTPError as error:
              status = error.code
              error.close()
              print(f'private_main_ref=unavailable http_status={status}')
              raise SystemExit(1)
          except Exception:
              print('private_main_ref=unavailable reason=transport_or_response')
              raise SystemExit(1)
          obj = value.get('object', {})
          if (status != 200 or value.get('ref') != 'refs/heads/main'
                  or obj.get('type') != 'commit'
                  or not isinstance(obj.get('sha'), str)
                  or re.fullmatch(r'[0-9a-f]{40}', obj['sha']) is None):
              print(f'private_main_ref=invalid http_status={status}')
              raise SystemExit(1)
          print(f'private_main_ref=readable http_status={status} sha_length=40')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + obj['sha'] + '\n')
          PY
      - name: Validate and render the next runtime policy (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import tempfile
          from pathlib import Path

          runtime_scripts = Path('runtime/get-runtime/scripts').resolve()
          sys.path.insert(0, str(runtime_scripts))
          import get_private_preview_retention as retention
          import get_private_runtime_bindings as bindings

          workflow = Path('automation/.github/workflows/get-canonical.yml').read_text(encoding='utf-8')
          policy_b64 = re.search(r"POLICY_B64: '([^']+)'", workflow).group(1)
          policy = json.loads(base64.b64decode(policy_b64, validate=True))
          policy_sha = re.search(r"POLICY_SHA256: '([0-9a-f]{64})'", workflow).group(1)
          private_token = os.environ.get('PRIVATE_VAULT_TOKEN')
          github_token = os.environ.get('GITHUB_TOKEN')

          try:
              with tempfile.TemporaryDirectory(prefix='registered-proof-') as directory:
                  binding_path = Path(directory) / 'bindings' / 'runtime-bindings.json'
                  remote = retention.GitHubRemote(None, private_token)
                  bindings.bootstrap(remote, str(binding_path))
                  os.environ[bindings.ENV_FILE] = str(binding_path)
                  import get_private_proof as proof
                  import get_publication_provenance as provenance
                  import get_recurring_controller as controller

                  old_policy_sha = policy_sha
                  policy['code_sha'] = '2c549d7e816563cf858102f88dbe48a28146346d'
                  policy_bytes = provenance.a.encoded(policy)
                  policy_sha = provenance.a.sha(policy_bytes)
                  policy = provenance.validate_policy(policy, policy_sha)
                  scope_sha = provenance.a.sha(
                      provenance.a.encoded(controller.scope_for(policy, policy_sha)))
                  rendered = controller.render(policy, policy_sha, scope_sha, scheduled=False)
                  expected = (workflow
                      .replace("ref: '75655ba42d918f066db4904b236c0bfcbce5f922'", "ref: '2c549d7e816563cf858102f88dbe48a28146346d'")
                      .replace("RUNTIME_SHA: '75655ba42d918f066db4904b236c0bfcbce5f922'", "RUNTIME_SHA: '2c549d7e816563cf858102f88dbe48a28146346d'")
                      .replace("POLICY_B64: '" + re.search(r"POLICY_B64: '([^']+)'", workflow).group(1) + "'", "POLICY_B64: '" + base64.b64encode(policy_bytes).decode('ascii') + "'")
                      .replace(old_policy_sha, policy_sha)
                      .replace(re.search(r"SCOPE_SHA256: '([0-9a-f]{64})'", workflow).group(1), scope_sha))
                  print('candidate_policy_b64=' + base64.b64encode(policy_bytes).decode('ascii'))
                  print('candidate_policy_sha256=' + policy_sha)
                  print('candidate_scope_sha256=' + scope_sha)
                  if rendered.decode('utf-8') != expected:
                      print('rendered_controller_matches=no')
                      raise SystemExit(1)
                  print('rendered_controller_matches=yes')
                  client = provenance.PublicGithub(github_token)
                  resolver = proof.PrivateRecords(remote)
                  resolver.expected_head = remote.ref('refs/heads/main')
                  client.private_proof_source = resolver
                  original_fail = provenance.fail
                  def traced_fail(code):
                      if code == 'provenance_run_changed':
                          check = 'trace_unavailable'
                          fields = []
                          try:
                              frame = sys._getframe(1)
                              check = frame.f_code.co_name + ':' + str(frame.f_lineno)
                              if frame.f_code.co_name == 'verified_candidate':
                                  local = frame.f_locals
                                  candidate = local.get('run', {})
                                  listed = local.get('listed', {})
                                  identity_keys = ('id', 'workflow_id', 'path', 'head_sha', 'head_branch', 'event')
                                  semantic_keys = ('id', 'run_attempt', 'workflow_id', 'path', 'head_sha', 'head_branch', 'event', 'status', 'conclusion', 'run_started_at')
                                  identity_diff = [key for key in identity_keys if candidate.get(key) != listed.get(key)]
                                  semantic_diff = [key for key in semantic_keys
                                                   if (key in candidate or key in listed)
                                                   and candidate.get(key) != listed.get(key)]
                                  if local.get('run_attempt') != candidate.get('run_attempt'):
                                      fields.append('attempt')
                                  if identity_diff:
                                      fields.append('identity:' + ','.join(identity_diff))
                                  if semantic_diff:
                                      fields.append('binding:' + ','.join(semantic_diff))
                                  if candidate.get('created_at') and listed.get('created_at'):
                                      delta = (provenance.timestamp(candidate['created_at']) - provenance.timestamp(listed['created_at'])).total_seconds()
                                      fields.append('created_clock:' + ('outside_1s' if abs(delta) > 1 else 'within_1s'))
                                  else:
                                      fields.append('created_clock:unavailable')
                                  fields.append('clock_witness:' + ('present' if local.get('clock_witness') is not None else 'absent'))
                                  check = 'verified_candidate:' + str(candidate.get('id', 'unknown')) + '/' + str(local.get('run_attempt', 'unknown'))
                          except Exception:
                              check = 'trace_unavailable'
                              fields = ['trace_unavailable']
                          print('run_change_check=' + check + ' conditions=' + (','.join(fields) or 'other'), flush=True)
                      original_fail(code)
                  provenance.fail = traced_fail
                  result = provenance.discover(
                      client, policy, exclude_run_id=41941431387,
                      exclude_run_attempt=1, capture_history_witness=True)
                  print('publication_check=' + str(result.get('status', 'verified')))
          except SystemExit:
              raise
          except Exception as error:
              code = str(error)
              allowed = {'provenance_run_changed', 'provenance_run', 'provenance_job',
                         'provenance_no_verified_publication', 'private_proof_unverified',
                         'provenance_transport', 'provenance_timestamp'}
              print('publication_check=' + (code if code in allowed else 'failed'))
              raise SystemExit(1)
          PY
