name: Validate Get sync in ephemeral shadow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded two-note sample (default) or explicit full-library acceptance
        type: choice
        options: [sample, full]
        default: sample
        required: true
      sample_pages:
        description: List pages to inspect for one ordinary note and one recording
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read

concurrency:
  group: getnote-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Read bounded Get sample twice
        id: sample_read
        if: inputs.mode == 'sample'
        env:
          GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY }}
          GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID }}
          SAMPLE_PAGES: ${{ inputs.sample_pages }}
        run: timeout 12m python scripts/run_private_command.py --label 'Get sample shadow' --stdout-file '${{ runner.temp }}/shadow-result.json' -- python scripts/verify_shadow_repeat.py --sample-pages "$SAMPLE_PAGES"
      - name: Read full Get library twice (explicit only)
        id: full_read
        if: inputs.mode == 'full'
        env:
          GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY }}
          GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID }}
        run: timeout 55m python scripts/run_private_command.py --label 'Get full shadow' --stdout-file '${{ runner.temp }}/shadow-result.json' -- python scripts/verify_shadow_repeat.py --full
      - name: Publish aggregate evidence only
        if: always()
        env:
          RESULT: ${{ runner.temp }}/shadow-result.json
          READ_OUTCOME: ${{ inputs.mode == 'full' && steps.full_read.outcome || steps.sample_read.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RESULT'])
          try:
              result = json.loads(path.read_text()) if path.is_file() else {}
          except (OSError, json.JSONDecodeError):
              result = {}
          allowed = ('source', 'scope', 'source_complete', 'status', 'sample_pages_limit',
                     'files', 'fetched', 'written_or_changed', 'identical_hashes_and_mtimes',
                     'published', 'run', 'exit')
          summary = {k: result[k] for k in allowed if k in result}
          summary['read_step_outcome'] = os.environ['READ_OUTCOME']
          if not result:
              summary['status'] = 'no-safe-aggregate'
              summary['source'] = 'getnote'
              summary['published'] = False
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(json.dumps(summary, indent=2))
              out.write('\n')
          PY
