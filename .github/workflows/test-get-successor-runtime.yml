name: Test Get successor runtime
on:
  pull_request:
    paths:
      - 'get-runtime/**'
      - '.github/workflows/test-get-successor-runtime.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s get-runtime/tests -p test_disabled_historical_bindings.py -v
