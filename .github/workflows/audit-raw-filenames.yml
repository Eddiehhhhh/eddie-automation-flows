name: Audit Raw filenames

on:
  schedule:
    # ~13:47 Asia/Shanghai daily (off :00/:30 to avoid contention)
    - cron: "47 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [audit-filenames]

permissions:
  contents: write

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out private vault
        uses: actions/checkout@v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run filename audit
        id: audit
        run: |
          set -euo pipefail
          python scripts/run_private_command.py --label "filename audit" --stdout-file /tmp/audit-result.json -- python scripts/audit_raw_filenames.py --json --exit-zero
          violations=$(python -c "import json; d=json.load(open('/tmp/audit-result.json')); print(d['total'])")
          echo "violations=$violations" >> "$GITHUB_OUTPUT"
          echo "Found $violations filename violations"

      - name: Attempt auto-fix
        if: steps.audit.outputs.violations != '0'
        run: |
          python scripts/run_private_command.py --label "filename repair" -- python scripts/audit_raw_filenames.py --fix --exit-zero

      - name: Re-check after fix
        if: steps.audit.outputs.violations != '0'
        id: recheck
        run: |
          python scripts/run_private_command.py --label "filename recheck" --stdout-file /tmp/recheck-result.json -- python scripts/audit_raw_filenames.py --json --exit-zero
          remaining=$(python -c "import json; d=json.load(open('/tmp/recheck-result.json')); print(d['total'])")
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: Log audit result
        run: |
          mkdir -p vault/.github/state
          install -m 600 /tmp/audit-result.json vault/.github/state/filename-audit-last-run.json
          python -c "
          import json
          d = json.load(open('/tmp/audit-result.json'))
          total = d['total']
          lines = ['## Filename audit result']
          lines.append(f'- violations: {total}')
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('\n'.join(lines) + '\n')
          "

      - name: Commit auto-fixes
        if: steps.audit.outputs.violations != '0' && steps.recheck.outputs.remaining == '0'
        run: |
          python scripts/commit_private_vault.py --all \
            --message "Auto-fix: rename ${{ steps.audit.outputs.violations }} violating filenames" \
            --path "Raw/01 Flomo" --path "Raw/03 Get" --path "Raw/06 TencentDocs" \
            --path ".github/state/filename-audit-last-run.json"

      - name: Report remaining violations
        if: steps.audit.outputs.violations != '0' && steps.recheck.outputs.remaining != '0'
        run: |
          echo "::error::${{ steps.recheck.outputs.remaining }} filename violations remain after auto-fix. Manual investigation needed."
          exit 1
