name: Sync Wiki pages to Notion

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC.
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      revision_request:
        description: "Opaque UUID of a reviewed request in the existing private mirror state"
        required: false
        default: ""
        type: string
      bulk_request:
        description: "Opaque UUID of the approved bounded initial-migration request"
        required: false
        default: ""
        type: string
      recover_intents:
        description: "Read target outcomes without issuing Notion writes"
        required: false
        default: false
        type: boolean
      persist_recovery:
        description: "Commit conclusively verified recovery to private state"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Resolve changes without writing Notion or state"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [sync-wiki-to-notion]

permissions:
  contents: write

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_VAULT_TOKEN: ${{ secrets.PRIVATE_VAULT_TOKEN }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_WIKI_MIRROR_PARENT_PAGE_ID: ${{ secrets.NOTION_WIKI_MIRROR_PARENT_PAGE_ID }}
      NOTION_WIKI_MIRROR_PARENT_PAGE_TITLE: ${{ secrets.NOTION_WIKI_MIRROR_PARENT_PAGE_TITLE }}
      NOTION_WIKI_MIRROR_ROOT_TITLE: ${{ secrets.NOTION_WIKI_MIRROR_ROOT_TITLE }}
      NOTION_WIKI_MIRROR_INCLUDE_JSON: ${{ secrets.NOTION_WIKI_MIRROR_INCLUDE_JSON }}
      NOTION_WIKI_MIRROR_EXCLUDE_JSON: ${{ secrets.NOTION_WIKI_MIRROR_EXCLUDE_JSON }}
      NOTION_WIKI_MIRROR_BUNDLE_PASSPHRASE: ${{ secrets.NOTION_WIKI_MIRROR_BUNDLE_PASSPHRASE }}
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out private vault
        uses: actions/checkout@v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
          sparse-checkout: |
            AGENTS.md
            README.md
            Wiki
            Schema
            .github/state
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync protected wiki content to Notion
        shell: bash
        env:
          REVISION_REQUEST: ${{ inputs.revision_request }}
          BULK_REQUEST: ${{ inputs.bulk_request }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "$BULK_REQUEST" ]]; then
              args+=(--bulk-request "$BULK_REQUEST")
            fi
            if [[ -n "$REVISION_REQUEST" ]]; then
              args+=(--execute-request "$REVISION_REQUEST")
            fi
            if [[ "${{ inputs.recover_intents }}" == "true" ]]; then
              args+=(--recover-intents)
            fi
            if [[ "${{ inputs.persist_recovery }}" == "true" ]]; then
              args+=(--persist-recovery)
            fi
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              args+=(--dry-run)
            fi
          else
            args+=(--execute-bulk)
          fi
          python scripts/run_private_command.py --label "Wiki to Notion sync" --stdout-file /tmp/notion-mirror-result.json -- python scripts/sync_wiki_to_notion.py "${args[@]}"

      - name: Commit private mirror state
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.dry_run == false && inputs.recover_intents == false) }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/commit_private_vault.py --message "Sync wiki mirror state to Notion" \
            --path ".github/state/notion-wiki-mirror-state.json"

      - name: Report safe mirror failure code
        if: ${{ failure() }}
        run: |
          python - <<'PYDIAG'
          import json
          from pathlib import Path

          allowed = {"held", "checkpoint_helper_unavailable", "checkpoint_publication_failed", "checkpoint_timeout"}
          code = "held"
          try:
              path = Path("/tmp/notion-mirror-result.json")
              if path.stat().st_size <= 1024:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  if (isinstance(payload, dict) and payload.get("status") == "needs_review"
                          and isinstance(payload.get("failure_code"), str)
                          and payload["failure_code"] in allowed):
                      code = payload["failure_code"]
          except (OSError, ValueError):
              pass
          print("Notion mirror failure_code=" + code)
          PYDIAG
