name: Sync GetNote voice notes to flomo

on:
  schedule:
    # Every 30 minutes. GitHub cron is UTC; the flow itself filters recent notes.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect candidates without creating flomo memos"
        required: false
        type: boolean
        default: true
      hours_back:
        description: "Look back window in hours"
        required: false
        type: string
        default: "36"
      max_notes:
        description: "Maximum candidate notes to process"
        required: false
        type: string
        default: "80"
  repository_dispatch:
    types: [sync-getnote-voice-flomo]

permissions:
  contents: write

concurrency:
  group: eddie-private-vault-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GETNOTE_API_KEY: ${{ secrets.GETNOTE_API_KEY || secrets.GET_API_KEY }}
      GETNOTE_CLIENT_ID: ${{ secrets.GETNOTE_CLIENT_ID || secrets.GET_CLIENT_ID }}
      FLOMO_TOKEN: ${{ secrets.FLOMO_TOKEN || secrets.FLOMO_MCP_TOKEN }}
      GETNOTE_VOICE_FLOMO_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.hours_back || '36' }}
      GETNOTE_VOICE_FLOMO_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_notes || '80' }}
      VAULT_ROOT: ${{ github.workspace }}/vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out private vault
        uses: actions/checkout@v7
        with:
          repository: Eddiehhhhh/eddie-llm-wiki
          token: ${{ secrets.PRIVATE_VAULT_TOKEN }}
          path: vault
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync voice notes to flomo
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/run_private_command.py --label "GetNote voice dry run" --stdout-file /tmp/getnote-voice-flomo-result.json -- python scripts/sync_getnote_voice_to_flomo.py --dry-run
          else
            python scripts/run_private_command.py --label "GetNote voice sync" --stdout-file /tmp/getnote-voice-flomo-result.json -- python scripts/sync_getnote_voice_to_flomo.py
          fi

      - name: Summarize sync result
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("/tmp/getnote-voice-flomo-result.json")
          if not result_path.exists():
              raise SystemExit("missing result json")
          payload = json.loads(result_path.read_text(encoding="utf-8"))
          state_dir = Path("vault/.github") / "state"
          state_dir.mkdir(parents=True, exist_ok=True)
          (state_dir / "getnote-voice-flomo-last-run.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          lines = [
              "## GetNote voice to flomo result",
              f"- dry_run: {payload.get('dry_run')}",
              f"- scanned: {payload.get('scanned')}",
              f"- candidate: {payload.get('candidate')}",
              f"- created: {payload.get('created')}",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Commit state changes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          python scripts/commit_private_vault.py --message "Update GetNote voice flomo sync state" \
            --path ".github/state/getnote-voice-flomo-sync.json" \
            --path ".github/state/getnote-voice-flomo-last-run.json"
